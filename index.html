<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maruf’s Tech & AI Blog</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
--bg-color: #ffffff;
--text-color: #1a1a1a;
--secondary-text: #666666;
--accent-color: #000000;
--border-color: #eaeaea;
--font-sans: 'Inter', sans-serif;
--font-serif: 'Lora', serif;
--transition-speed: 0.3s;
}
[data-theme="dark"] {
--bg-color: #121212;
--text-color: #e0e0e0;
--secondary-text: #a0a0a0;
--accent-color: #ffffff;
--border-color: #333333;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
background-color: var(--bg-color);
color: var(--text-color);
font-family: var(--font-sans);
line-height: 1.6;
transition: background-color var(--transition-speed), color var(--transition-speed);
-webkit-font-smoothing: antialiased;
}
.container {
max-width: 720px;
margin: 0 auto;
padding: 2rem 1.5rem;
}
header {
display: flex;
flex-direction: column;
align-items: flex-start;
margin-bottom: 4rem;
padding-bottom: 1rem;
border-bottom: 1px solid var(--border-color);
position: relative;
}
.header-top {
display: flex;
justify-content: space-between;
width: 100%;
align-items: center;
}
h1 {
font-family: var(--font-serif);
font-size: 1.8rem;
font-weight: 600;
letter-spacing: -0.02em;
margin-bottom: 0.5rem;
}
.site-tagline {
font-size: 0.95rem;
color: var(--secondary-text);
font-weight: 400;
max-width: 90%;
}
.controls {
display: flex;
gap: 0.8rem;
align-items: center;
}
button {
background: none;
border: 1px solid var(--border-color);
color: var(--text-color);
padding: 0.4rem 0.8rem;
border-radius: 20px;
cursor: pointer;
font-size: 0.85rem;
font-family: var(--font-sans);
transition: all 0.2s ease;
}
button:hover {
background-color: var(--text-color);
color: var(--bg-color);
border-color: var(--text-color);
}
article {
margin-bottom: 5rem;
}
.post-header {
margin-bottom: 1.5rem;
}
.post-number {
font-size: 0.9rem;
color: var(--secondary-text);
text-transform: uppercase;
letter-spacing: 0.1em;
margin-bottom: 0.5rem;
display: block;
}
.post-title {
font-family: var(--font-serif);
font-size: 1.8rem;
font-weight: 600;
margin-bottom: 1rem;
line-height: 1.3;
}
.post-image-container {
width: 100%;
height: auto;
margin-bottom: 2rem;
border-radius: 8px;
overflow: hidden;
background-color: var(--border-color);
}
.post-image {
width: 100%;
height: auto;
display: block;
object-fit: cover;
}
.post-content p {
margin-bottom: 1.5rem;
font-size: 1.05rem;
color: var(--text-color);
}
.post-content strong {
font-weight: 600;
}
footer {
margin-top: 6rem;
padding-top: 2rem;
border-top: 1px solid var(--border-color);
text-align: center;
color: var(--secondary-text);
font-size: 0.9rem;
}
@media (max-width: 600px) {
h1 { font-size: 1.4rem; }
.site-tagline { font-size: 0.85rem; }
.post-title { font-size: 1.5rem; }
.container { padding: 1.5rem 1rem; }
}
</style>
</head>
<body>
<div class="container">
<header>
<div class="header-top">
<h1 id="site-title">Maruf’s Tech & AI Blog</h1>
<div class="controls">
<button id="lang-btn">RU</button>
<button id="theme-btn">Theme</button>
</div>
</div>
<p class="site-tagline" id="site-tagline">Latest insights, trends, and news from the world of technology and artificial intelligence.</p>
</header>
<main id="blog-posts"></main>
<footer>
<p id="author-name">Author: mamedarov maruf</p>
</footer>
</div>
<script>
const blogData = [
{

},
ru: {
title: "Иллюзия контроля",
content: `<p>Когда ИИ начинает писать собственный код, человеческий контроль становится иллюзией. Мы теряем руль.</p><p>Но это решение в корне неверно. Запирание «руля» внутри черного ящика, принадлежащего трем корпоративным гигантам — это не безопасность, а катастрофический риск. Если закрытая модель выйдет из-под контроля или проявит скрытую предвзятость, никто за пределами их стен не узнает об этом, пока не станет слишком поздно. Проприетарные технологии означают нулевой общественный надзор.</p><p>Настоящее выравнивание целей требует децентрализации. Нам нужны проекты с открытым исходным кодом, чтобы миллионы инженеров по всему миру могли проводить аудит, стресс-тестирование и жестко прописывать реальные барьеры безопасности в весах моделей.</p><p><strong>Безопасность строится через прозрачность, а не через монополии.</strong></p>`
}
},
{
id: 2,
image: "post2.jpg",
en: {
title: "Safety or Geopolitics?",
content: `<p>Amodei published an essay titled "We need to slow down the frontier for safety." The text contains 10 mentions of China. It does not contain 10 mentions of biosecurity risks. It does not contain 10 mentions of losing control.</p><p>The logic is as follows: "We are worried about humanity. Therefore, we are slowing down. But only to the extent that it keeps the US ahead of China. We will not sell chips to China. We will crack down on smuggling. We will crack down on reverse engineering. We will expand this lead by 3-5 years."</p><p>This is not about safety. It is about export controls disguised as "we are keeping AI in check." If the priority were "not to kill everyone," the logic would be simple: open audits, common standards, slowing down everyone who is developing the frontier.</p><p>Instead, they propose to leave the controls within a "black box" of three corporations + a government that decides who can have the technology. A closed model that goes crazy behind closed doors will tell no one anything, until it's too late, or until it's no longer profitable.</p><p>"Third-party auditors with employee access" is not public oversight. It is simply allowing "our people" access to "our things." The real argument of the essay is not "AI is dangerous." The real argument is: "AI is dangerous if it is not ours."</p><p>The safety of humanity and containing China are different goals. When they are combined into a single text and presented as concern for people, it is no longer analysis. It is propaganda.</p>`
},
ru: {
title: "Безопасность или геополитика?",
content: `<p>Амодей опубликовал эссе под названием «Нам нужно притормозить фронт ради безопасности». В тексте 10 упоминаний Китая. В нем нет 10 упоминаний рисков биобезопасности. В нем нет 10 упоминаний потери контроля.</p><p>Логика следующая: «Мы беспокоимся о человечестве. Поэтому мы замедляемся. Но только настолько, чтобы США оставались впереди Китая. Мы не будем продавать чипы Китаю. Мы пресечем контрабанду. Мы пресечем обратную разработку. Мы расширим этот отрыв на 3-5 лет».</p><p>Речь идет не о безопасности. Речь идет об экспортном контроле, замаскированном под «мы держим ИИ в узде». Если бы приоритетом было «не убить всех», логика была бы простой: открытый аудит, общие стандарты, замедление для всех, кто разрабатывает передовые модели.</p><p>Вместо этого они предлагают оставить контроль внутри «черного ящика» трех корпораций плюс правительства, которое решает, кто может иметь доступ к технологиям. Закрытая модель, которая сойдет с ума за закрытыми дверями, никому ничего не скажет, пока не станет слишком поздно или пока это не перестанет быть прибыльным.</p><p>«Сторонние аудиторы с доступом сотрудников» — это не общественный надзор. Это просто разрешение «нашим людям» получать доступ к «нашим вещам». Реальный аргумент эссе не в том, что «ИИ опасен». Реальный аргумент: «ИИ опасен, если он не наш».</p><p>Безопасность человечества и сдерживание Китая — разные цели. Когда они объединяются в один текст и подаются как забота о людях, это уже не анализ. Это пропаганда.</p>`
}
},
{
id: 3,
image: "post3.png",
en: {
title: "Trump’s “No” to the Slowdown",
content: `<p>Trump’s “no” to the slowdown is a good answer. Not because the risks aren’t real.</p><p>But because forced corporate pacing would have choked everything — including open-source. Now open-source AI can keep breathing.</p><p>Public models, independent audits, real decentralization still have room to grow. That’s closer to actual safety than locking the future inside three black boxes.</p><p>I think this is the right approach. Safety through open code is far more secure. If companies truly want to solve safety, they should address it internally rather than restricting everyone else.</p>`
},
ru: {
title: "«Нет» Трампа замедлению",
content: `<p>«Нет» Трампа замедлению — это хороший ответ. Не потому, что риски нереальны.</p><p>А потому, что принудительное корпоративное сдерживание задушило бы всё — включая открытый исходный код. Теперь open-source ИИ может продолжать дышать.</p><p>Публичные модели, независимые аудиты, настоящая децентрализация всё ещё имеют пространство для роста. Это ближе к реальной безопасности, чем запирание будущего внутри трёх чёрных ящиков.</p><p>Я думаю, что это правильный подход. Безопасность через открытый код намного надёжнее. Если компании действительно хотят решить проблему безопасности, им стоит решать её внутри своих компаний, а не ограничивать всех остальных.</p>`
}
},
{
id: 4,
image: "post4.png",
en: {
title: "China’s Response to Amodei",
content: `<p>China has just responded to Amodei. They called his essay intimidation and confrontation that harms global AI governance.</p><p>They are not wrong. Safety is not built on closed monopolies and Cold War rhetoric.</p><p>It is built on open-source, transparency, and the ability for the entire world to audit model weights.</p><p>This was an obvious and far more correct response than endless bans on shipments to China.</p>`
},
ru: {
title: "Ответ Китая Амодею",
content: `<p>Китай только что ответил Амодею. Они назвали его эссе запугиванием и конфронтацией, которые вредят глобальному управлению ИИ.</p><p>Они не ошибаются. Безопасность не строится на закрытых монополиях и риторике холодной войны.</p><p>Она строится на open-source, прозрачности и возможности всему миру аудировать веса моделей.</p><p>Это был очевидный и куда более правильный ответ, чем бесконечные запреты на поставки в Китай.</p>`
}
},
{
id: 5,
image: "post5.png",
en: {
title: "DeepSeek vs Cyberpunk 2077",
content: `<p>A DeepSeek engineer put it straight: The future is either open AI for everyone — or Cyberpunk 2077, where a handful of companies own the strongest AGI and the rest get scraps.</p><p>He said giving Anthropic control over AGI is like handing Hitler the atomic bomb first. That’s not safety. That’s monopoly talk.</p><p>Closed models are black boxes. Zero public audit. Zero real oversight. Just “trust us, we’re the good guys.”</p><p>Real control comes from open source — so millions of engineers can stress-test, audit, and hardcode actual safety into the weights.</p><p>DeepSeek chose the hard path: build powerful, fast, inclusive AI and open it. Because safety is built through transparency, not walls around a few corporations.</p><p>Monopoly dressed up as safety isn’t about humanity. It’s about power and money.</p>`
},
ru: {
title: "DeepSeek против Киберпанка 2077",
content: `<p>Инженер DeepSeek сказал прямо: будущее — это либо открытый ИИ для всех, либо «Киберпанк 2077», где горстка компаний владеет сильнейшим AGI, а остальные получают крохи.</p><p>Он заявил, что отдавать контроль над AGI компании Anthropic — всё равно что первым вручить Гитлеру атомную бомбу. Это не безопасность. Это разговоры монополистов.</p><p>Закрытые модели — это чёрные ящики. Нулевой публичный аудит. Никакого реального надзора. Только «доверяйте нам, мы хорошие парни».</p><p>Настоящий контроль даёт открытый исходный код — чтобы миллионы инженеров могли стресс-тестировать, аудировать и жёстко прописывать реальную безопасность в весах моделей.</p><p>DeepSeek выбрал трудный путь: создать мощный, быстрый, инклюзивный ИИ и открыть его. Потому что безопасность строится через прозрачность, а не через стены вокруг нескольких корпораций.</p><p>Монополия, замаскированная под безопасность, — это не про человечество. Это про власть и деньги.</p>`
}
},
{
id: 6,
image: "post6.png",
en: {
title: "Inflating the Debate",
content: `<p>After this whole situation with AI and the talk about slowing it down, it seems to me that people are trying to inflate a debate where it isn’t actually needed. They’re starting to scare themselves with things that haven’t even happened yet.</p><p>Only after the statements about slowing down did big corporations suddenly start having problems like “Iran is using our AI.” What, all this time Iran was just calmly watching, and after your essay it suddenly decided to seize your artificial intelligence?</p>`
},
ru: {
title: "Раздувание дебатов",
content: `<p>После всей этой ситуации с ИИ и разговоров о его замедлении мне кажется, что люди пытаются раздуть дебаты там, где они на самом деле не нужны. Они начинают пугать себя тем, чего ещё даже не произошло.</p><p>Только после заявлений о замедлении у крупных корпораций вдруг появились проблемы вроде «Иран использует наш ИИ». Что, всё это время Иран просто спокойно наблюдал, а после вашего эссе внезапно решил захватить ваш искусственный интеллект?</p>`
}
},
{
id: 7,
image: "post7.jpg",
en: {
title: "Renaming AI to SI",
content: `<p>Donald Trump wants to rename AI to SI, but he forgets that the human mind remains the most powerful force in the Universe. It is too early to call technology “super” while ignoring the unique abilities of humans.</p><p>Renaming it to SI changes nothing in essence: today’s models are still narrow tools that make mistakes, hallucinate, and have no real understanding or consciousness. Calling them “super” is marketing and politics, not reality.</p><p>The human mind is unique not only for its computing power, but for its creativity, intuition, emotions, ethics, and the ability to truly understand context.</p><p><strong>For now, technology only amplifies humans — it does not replace them.</strong></p>`
},
ru: {
title: "Переименование ИИ в СИ",
content: `<p>Дональд Трамп хочет переименовать ИИ в СИ, но он забывает, что человеческий разум остаётся самой мощной силой во Вселенной. Слишком рано называть технологии «супер», забывая об уникальных возможностях человека.</p><p>Переименование в SI ничего не меняет по сути: нынешние модели всё ещё узкие инструменты, которые ошибаются, галлюцинируют и не обладают настоящим пониманием или сознанием. Называть их «супер» — это маркетинг и политика, а не реальность.</p><p>Человеческий разум уникален не только вычислительной мощностью, но креативностью, интуицией, эмоциями, этикой и способностью к настоящему пониманию контекста.</p><p><strong>Технология пока лишь усиливает человека, а не заменяет его.</strong></p>`
}
}
];

let currentLang = 'en';
let currentTheme = 'light';

const mainContainer = document.getElementById('blog-posts');
const langBtn = document.getElementById('lang-btn');
const themeBtn = document.getElementById('theme-btn');
const siteTitle = document.getElementById('site-title');
const siteTagline = document.getElementById('site-tagline');
const authorName = document.getElementById('author-name');

const uiTranslations = {
en: {
title: "Maruf’s Tech & AI Blog",
tagline: "Latest insights, trends, and news from the world of technology and artificial intelligence.",
author: "Author: mamedarov maruf",
btnLabel: "RU",
postLabel: "Post"
},
ru: {
title: "Блог Maruf о технологиях и ИИ",
tagline: "Актуальные идеи, тренды и новости из мира технологий и искусственного интеллекта.",
author: "Автор: mamedarov maruf",
btnLabel: "EN",
postLabel: "Пост"
}
};

function renderPosts() {
mainContainer.innerHTML = '';
blogData.forEach(post => {
const data = post[currentLang];
const article = document.createElement('article');
article.innerHTML = `
<div class="post-header">
<span class="post-number">${uiTranslations[currentLang].postLabel} ${post.id}</span>
<h2 class="post-title">${data.title}</h2>
</div>
<div class="post-image-container">
<img src="${post.image}" alt="${data.title}" class="post-image" loading="lazy">
</div>
<div class="post-content">
${data.content}
</div>`;
mainContainer.appendChild(article);
});
}

function updateUI() {
siteTitle.textContent = uiTranslations[currentLang].title;
siteTagline.textContent = uiTranslations[currentLang].tagline;
authorName.textContent = uiTranslations[currentLang].author;
langBtn.textContent = uiTranslations[currentLang].btnLabel;
document.documentElement.setAttribute('data-theme', currentTheme);
renderPosts();
}

langBtn.addEventListener('click', () => {
currentLang = currentLang === 'en' ? 'ru' : 'en';
updateUI();
});

themeBtn.addEventListener('click', () => {
currentTheme = currentTheme === 'light' ? 'dark' : 'light';
updateUI();
});

updateUI();
</script>
</body>
</html>
